name: Update P/E

on:
  schedule:
    # Mon–Fri at 22:17 UTC, after the US close. Vercel redeploys on the commit.
    - cron: "17 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Accept P/E moves larger than 40%"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  update-pe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yfinance
        run: pip install "yfinance>=0.2.66"

      - name: Refresh P/E in data.json
        run: python scripts/update_pe.py ${{ inputs.force && '--force' || '' }}

      - name: Commit if changed
        run: |
          if git diff --quiet data.json; then
            echo "No P/E changes."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "data: refresh P/E from Yahoo ($(date -u +%Y-%m-%d))"
          git push
